<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 0; background: #faf6ee; overflow: hidden; }
  canvas { display: block; width: 1920px; height: 1080px; }
</style>
</head>
<body>
<canvas id="cvs" width="1920" height="1080"></canvas>
<script>
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');

// 19 篇章元数据
const chapters = [
  { index: 0, start: 0.0, end: 3.51, era: "片头", title: "五千年", desc: "一支笔，画完中国史" },
  { index: 1, start: 3.51, end: 14.43, era: "约前3000", title: "上古 · 三皇五帝", desc: "上古时代，炎帝和黄帝先打了一架，然后……握手成了一家人。从此我们都叫「炎黄子孙」。" },
  { index: 2, start: 14.43, end: 24.22, era: "约前2070", title: "夏 · 大禹治水", desc: "大禹治水十三年，三过家门而不入……史上第一位有记载的「加班狂」。喜提王位。" },
  { index: 3, start: 24.22, end: 28.84, era: "约前1600", title: "商 · 甲骨文 · 青铜器", desc: "商朝人遇事不决？烤龟壳！看裂纹定吉凶，刻下的字就是最早的成熟汉字——甲骨文。" },
  { index: 4, start: 28.84, end: 40.23, era: "前1046", title: "周 · 礼乐 · 烽火戏诸侯", desc: "周朝定下礼乐规矩。可惜被幽王为博美人一笑点烽火戏诸侯——「聊死了」真实版，这周总算倒霉。" },
  { index: 5, start: 40.23, end: 51.89, era: "前770", title: "春秋战国 · 百家争鸣", desc: "春秋战国：诸侯打成一锅粥，思想家却吵出了黄金时代。孔子、老子、韩非，各显神通。" },
  { index: 6, start: 51.89, end: 64.98, era: "前221", title: "秦 · 六一统", desc: "秦始皇统一六国：统一文字、统一货币，连车轮间距都要统一——强迫症的胜利。长城和兵马俑也安排上了。" },
  { index: 7, start: 64.98, end: 77.42, era: "前202", title: "汉 · 丝绸之路", desc: "汉朝，张骞出使西域，一趟出差十三年，顺手走出一条丝绸之路。「买买买」「吃货」狂喜，就从这儿来。" },
  { index: 8, start: 77.42, end: 87.6, era: "220", title: "三国 · 魏 · 蜀 · 吴", desc: "三国：魏蜀吴三分天下。诸葛亮草船借箭，一口气借了十万支——一支都没还。" },
  { index: 9, start: 87.6, end: 98.84, era: "265", title: "魏晋南北朝 · 书法 · 兰亭", desc: "魏晋南北朝：天下很乱，文人很飘。王羲之爱写字也爱养鹅，一篇《兰亭序》火了一千多年。" },
  { index: 10, start: 98.84, end: 110.17, era: "581", title: "隋 · 大运河", desc: "隋朝只存在了38年，却干了两件大事：挖通大运河，开创科举——普通人也能靠读书改命了。" },
  { index: 11, start: 110.17, end: 121.99, era: "618", title: "唐 · 盛世大唐", desc: "大唐盛世！长安是国际大都市，万国来朝。李白喝醉看明月——诗写得好，酒量更有长进。" },
  { index: 12, start: 121.99, end: 134.71, era: "960", title: "宋 · 东坡 · 发明", desc: "宋朝经济文化全面开花：活字印刷、指南针、火药全就位。苏东坡更忙，一边被贬一边发明东坡肉。" },
  { index: 13, start: 134.71, end: 147.33, era: "1271", title: "元 · 蒙古铁骑", desc: "元朝：蒙古铁骑一路狂奔，版图大到地图都快装不下。意大利人马可·波罗来旅游，回去写了本畅销日记。" },
  { index: 14, start: 147.33, end: 155.78, era: "1368", title: "明 · 郑和下西洋", desc: "明朝：郑和七下西洋，传说中的宝船比八十年后哥伦布的旗舰大得多。" },
  { index: 15, start: 155.78, end: 168.32, era: "1644", title: "清 · 康乾盛世 -> 1840", desc: "清朝：康乾盛世，人口破三亿……可惜到了1840年，列强的战舰开到了家门口，近代屈辱史开始了。" },
  { index: 16, start: 168.32, end: 178.33, era: "1911", title: "辛亥 · 帝制落幕", desc: "1911年辛亥革命，剪掉辫子，建立中华民国——两千多年的皇帝制度正式画上句号！" },
  { index: 17, start: 178.33, end: 187.25, era: "1949", title: "新中国 · 开国大典", desc: "1949年，中华人民共和国成立。一步一个脚印，日子越过越红火。" },
  { index: 18, start: 187.25, end: 198.0, era: "现在", title: "今天 · 高铁 · 航天", desc: "如今，高铁如飞驰、火箭排着队上天——当年的九天揽月与丝绸之路，如今已变成了现实！" }
];

// 辅助：绘制气泡
function drawBubble(x, y, text, isMascot = false, scale = 1.0) {
  if (scale <= 0.01) return;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#2b261f';
  ctx.lineWidth = 3;
  ctx.font = 'bold 22px SimHei, sans-serif';
  const tw = ctx.measureText(text).width;
  const bw = Math.max(140, tw + 40);
  ctx.beginPath();
  ctx.roundRect(-bw/2, -45, bw, 60, 20);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(-10, 15); ctx.lineTo(10, 15); ctx.lineTo(0, 32);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = isMascot ? '#a63426' : '#2b261f';
  ctx.textAlign = 'center';
  ctx.fillText(text, 0, -10);
  ctx.restore();
}

window.renderGlobalFrame = function(globalT) {
  ctx.clearRect(0, 0, 1920, 1080);

  // 定位当前篇章
  let ch = chapters[chapters.length - 1];
  for (let c of chapters) {
    if (globalT >= c.start && globalT < c.end) {
      ch = c;
      break;
    }
  }

  const localT = Math.max(0, globalT - ch.start);
  const chDur = ch.end - ch.start;

  // 1. 米黄色宣纸底色
  const bgGrad = ctx.createRadialGradient(960, 540, 200, 960, 540, 1100);
  bgGrad.addColorStop(0, '#faf6ee');
  bgGrad.addColorStop(1, '#ece4d2');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, 1920, 1080);
  ctx.strokeStyle = '#d5c8ad';
  ctx.lineWidth = 20;
  ctx.strokeRect(10, 10, 1900, 1060);

  // 2. 左上角朱砂印章与标题
  ctx.save();
  ctx.translate(100, 80);
  ctx.fillStyle = '#a63426';
  ctx.beginPath();
  const sealW = ch.era.length > 4 ? 125 : 100;
  ctx.roundRect(0, 0, sealW, 42, 4);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 20px SimSun, serif';
  ctx.textAlign = 'center';
  ctx.fillText(ch.era, sealW / 2, 28);
  ctx.fillStyle = '#2b261f';
  ctx.font = 'bold 52px SimSun, serif';
  ctx.textAlign = 'left';
  const mainTitle = ch.title.split('·')[0].trim();
  const subTitle = ch.title.includes('·') ? '· ' + ch.title.split('·').slice(1).join('·').trim() : '';
  ctx.fillText(mainTitle, sealW + 30, 38);
  ctx.fillStyle = '#7a6e5d';
  ctx.font = '24px SimSun, serif';
  ctx.fillText(subTitle, sealW + 30 + ctx.measureText(mainTitle).width + 15, 38);
  ctx.restore();

  // 3. 地面水墨延伸横线
  ctx.save();
  ctx.strokeStyle = '#3a342a';
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(100, 840);
  ctx.quadraticCurveTo(600, 836, 1100, 842);
  ctx.quadraticCurveTo(1500, 838, 1820, 840);
  ctx.stroke();
  ctx.restore();

  // 4. 左下角常驻小墨水团子 (视线锚点吉祥物)
  ctx.save();
  const mascotJump = Math.abs(Math.sin(globalT * 6)) * 14;
  ctx.translate(260, 810 - mascotJump);
  ctx.fillStyle = '#2b261f';
  ctx.beginPath();
  ctx.ellipse(0, 0, 42, 38, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(-14, -6, 7, 0, Math.PI * 2);
  ctx.arc(14, -6, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000000';
  ctx.beginPath();
  ctx.arc(-13, -6, 3, 0, Math.PI * 2);
  ctx.arc(15, -6, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#e88574';
  ctx.beginPath();
  ctx.arc(-22, 6, 7, 0, Math.PI * 2);
  ctx.arc(22, 6, 7, 0, Math.PI * 2);
  ctx.fill();
  // 小黑手挥舞
  ctx.strokeStyle = '#2b261f';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  const armMove = Math.sin(globalT * 10) * 15;
  ctx.beginPath();
  ctx.moveTo(-35, 5); ctx.lineTo(-55, -15 + armMove);
  ctx.moveTo(35, 5); ctx.lineTo(55, -15 - armMove);
  ctx.stroke();
  ctx.restore();

  // 5. 各篇章专属的核心动画与气泡交互
  const cx = 960, cy = 520;

  switch(ch.index) {
    case 0: // 片头
      ctx.save();
      ctx.translate(cx, cy);
      const titlePop = Math.min(1.0, localT * 2);
      ctx.scale(titlePop, titlePop);
      ctx.fillStyle = '#2b261f';
      ctx.font = 'bold 88px SimSun, serif';
      ctx.textAlign = 'center';
      ctx.fillText('五千年', 0, -40);
      ctx.fillStyle = '#a63426';
      ctx.font = '38px SimSun, serif';
      ctx.fillText('一支笔 · 画完中国史', 0, 50);
      ctx.restore();
      break;

    case 1: // 上古 炎黄牵手
      ctx.save();
      ctx.translate(cx, cy);
      // 太阳升起
      const sunY = -180 + Math.sin(localT * 2) * 8;
      ctx.fillStyle = '#e26d5c';
      ctx.beginPath();
      ctx.arc(320, sunY, 65, 0, Math.PI * 2);
      ctx.fill();
      // 炎帝与黄帝
      const yhWalk = Math.sin(localT * 4) * 6;
      // 炎帝
      ctx.fillStyle = '#a63426';
      ctx.beginPath(); ctx.ellipse(-160, 120 + yhWalk, 60, 75, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fcecd4';
      ctx.beginPath(); ctx.ellipse(-160, 20 + yhWalk, 45, 42, 0, 0, Math.PI * 2); ctx.fill();
      // 黄帝
      ctx.fillStyle = '#d4a34b';
      ctx.beginPath(); ctx.ellipse(160, 120 - yhWalk, 60, 75, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fcecd4';
      ctx.beginPath(); ctx.ellipse(160, 20 - yhWalk, 45, 42, 0, 0, Math.PI * 2); ctx.fill();
      // 手牵手红线
      ctx.strokeStyle = '#d4a34b'; ctx.lineWidth = 14; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-110, 130); ctx.lineTo(110, 130); ctx.stroke();
      // 心形动画 (2.5s 后心跳膨胀)
      if (localT > 2.5) {
        const heartPulse = 1.0 + Math.sin((localT - 2.5) * 6) * 0.15;
        ctx.save();
        ctx.translate(0, -10);
        ctx.scale(heartPulse, heartPulse);
        ctx.fillStyle = '#e26d5c';
        ctx.beginPath();
        ctx.moveTo(0, 20); ctx.bezierCurveTo(-40, -40, -80, 20, 0, 80);
        ctx.bezierCurveTo(80, 20, 40, -40, 0, 20);
        ctx.fill();
        ctx.restore();
      }
      ctx.restore();
      // 吐槽气泡 (4.5s 炎黄; 7.0s 墨水团子)
      if (localT > 4.5) drawBubble(820, 430, '打完握手：以后都是一家人！', false, Math.min(1.0, (localT - 4.5)*4));
      if (localT > 7.0) drawBubble(260, 680, '炎黄子孙报到！', true, Math.min(1.0, (localT - 7.0)*4));
      break;

    case 2: // 夏 大禹治水
      ctx.save();
      ctx.translate(cx, cy);
      // 茅草屋
      ctx.fillStyle = '#c49a56'; ctx.fillRect(-380, 60, 150, 140);
      ctx.fillStyle = '#d9ad67';
      ctx.beginPath(); ctx.moveTo(-305, -50); ctx.lineTo(-420, 60); ctx.lineTo(-190, 60); ctx.closePath(); ctx.fill();
      // 妻子
      ctx.fillStyle = '#fcecd4'; ctx.beginPath(); ctx.arc(-240, 120, 25, 0, Math.PI*2); ctx.fill();
      // 大禹大步走扛石铲
      const yuWalk = (localT * 35) % 180;
      ctx.save();
      ctx.translate(yuWalk - 40, 50);
      ctx.fillStyle = '#698572'; ctx.beginPath(); ctx.ellipse(0, 110, 55, 70, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fcecd4'; ctx.beginPath(); ctx.arc(0, 25, 38, 0, Math.PI*2); ctx.fill();
      // 斗笠
      ctx.fillStyle = '#bfa16b'; ctx.beginPath(); ctx.moveTo(0, -30); ctx.lineTo(-60, 10); ctx.lineTo(60, 10); ctx.closePath(); ctx.fill();
      // 扛着石铲
      ctx.strokeStyle = '#705b41'; ctx.lineWidth = 12; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-80, 160); ctx.lineTo(70, -25); ctx.stroke();
      ctx.fillStyle = '#807a73'; ctx.fillRect(50, -50, 40, 45);
      ctx.restore();
      ctx.restore();
      // 气泡
      if (localT > 2.0) drawBubble(720, 480, '妻子：又不回家吃饭？！', false, Math.min(1.0, (localT - 2.0)*4));
      if (localT > 5.0) drawBubble(1180, 460, '大禹：治水呢，加个班！', false, Math.min(1.0, (localT - 5.0)*4));
      if (localT > 7.5) drawBubble(260, 680, '史上第一加班狂喜提王位！', true, Math.min(1.0, (localT - 7.5)*4));
      break;

    case 3: // 商 烤龟壳
      ctx.save();
      ctx.translate(cx, cy);
      // 火苗跳动
      const flameH = 65 + Math.sin(localT * 16) * 14;
      ctx.fillStyle = '#d9432f';
      ctx.beginPath(); ctx.moveTo(-45, 260); ctx.quadraticCurveTo(-15, 260-flameH, 0, 260-flameH*1.2); ctx.quadraticCurveTo(15, 260-flameH, 45, 260); ctx.fill();
      ctx.fillStyle = '#f5a623';
      ctx.beginPath(); ctx.moveTo(-25, 260); ctx.quadraticCurveTo(0, 260-flameH*0.7, 25, 260); ctx.fill();
      // 龟壳颤抖
      const turtleShake = (localT > 1.0) ? Math.sin(localT * 35) * 3 : 0;
      ctx.translate(turtleShake, turtleShake);
      ctx.fillStyle = '#dfcfb2'; ctx.strokeStyle = '#423420'; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.ellipse(0, 40, 150, 200, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      // 龟壳网格
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, -160); ctx.lineTo(0, 240); ctx.moveTo(-140, -30); ctx.lineTo(140, -30); ctx.moveTo(-150, 100); ctx.lineTo(150, 100); ctx.stroke();
      // 裂纹生长
      if (localT > 2.0) {
        ctx.strokeStyle = '#992211'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(-10, -50); ctx.lineTo(25, -10); ctx.lineTo(10, 60); ctx.lineTo(50, 120); ctx.stroke();
      }
      // 甲骨文字弹出
      if (localT > 2.2) {
        ctx.fillStyle = '#2b261f'; ctx.font = 'bold 46px SimSun, serif'; ctx.textAlign = 'center';
        ctx.fillText('日', -70, -70);
        if (localT > 2.6) ctx.fillText('人', 70, -70);
        if (localT > 3.0) ctx.fillText('王', -70, 50);
        if (localT > 3.4) ctx.fillText('田', 70, 50);
      }
      ctx.restore();
      // 爬行小乌龟
      const crawlX = Math.max(1360, 1550 - localT * 40);
      ctx.save();
      ctx.translate(crawlX, 810);
      ctx.fillStyle = '#688e73'; ctx.beginPath(); ctx.arc(0, 0, 45, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#89b395'; ctx.beginPath(); ctx.arc(50, -5, 18, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#4a90e2'; ctx.beginPath(); ctx.ellipse(65, -15, 5, 8, Math.PI/4, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      if (localT > 1.8) drawBubble(crawlX, 690, '我做错了什么？！', false, Math.min(1.0, (localT - 1.8)*4));
      if (localT > 2.5) drawBubble(260, 680, '龟龟：我太难了！', true, Math.min(1.0, (localT - 2.5)*4));
      break;

    case 4: // 周 烽火戏诸侯
      ctx.save();
      ctx.translate(cx, cy);
      // 烽火台浓烟
      ctx.fillStyle = '#8c8270'; ctx.fillRect(-320, 60, 160, 180);
      const smokeY = (localT * 30) % 120;
      ctx.fillStyle = '#3a3731';
      ctx.beginPath(); ctx.arc(-240, -20 - smokeY, 45, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(-210, -70 - smokeY, 60, 0, Math.PI*2); ctx.fill();
      // 幽王与褒姒
      const laughJump = Math.abs(Math.sin(localT * 8)) * 10;
      ctx.save();
      ctx.translate(140, 60 - laughJump);
      ctx.fillStyle = '#a63426'; ctx.beginPath(); ctx.ellipse(-40, 100, 55, 70, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fcecd4'; ctx.beginPath(); ctx.arc(-40, 20, 38, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#d9758f'; ctx.beginPath(); ctx.ellipse(45, 100, 50, 65, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fcecd4'; ctx.beginPath(); ctx.arc(45, 25, 34, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      ctx.restore();
      if (localT > 2.5) drawBubble(1100, 480, '幽王：哈哈！博美人一笑了！', false, Math.min(1.0, (localT - 2.5)*4));
      if (localT > 5.5) drawBubble(640, 720, '诸侯：耍猴呢？！真把天聊死了！', false, Math.min(1.0, (localT - 5.5)*4));
      if (localT > 8.0) drawBubble(260, 680, '这周总算倒霉了...', true, Math.min(1.0, (localT - 8.0)*4));
      break;

    case 5: // 春秋战国 百家争鸣
      ctx.save();
      ctx.translate(cx, cy);
      const debaters = [
        { name: '孔子', text: '仁！', color: '#588b76', x: -360 },
        { name: '老子', text: '无为~', color: '#829ab1', x: -120 },
        { name: '墨子', text: '兼爱！', color: '#a67c52', x: 120 },
        { name: '韩非', text: '法！', color: '#2b261f', x: 360 }
      ];
      debaters.forEach((d, idx) => {
        const argueBounce = Math.sin(localT * 8 + idx) * 8;
        ctx.save();
        ctx.translate(d.x, 80 + argueBounce);
        ctx.fillStyle = d.color; ctx.beginPath(); ctx.ellipse(0, 80, 48, 65, 0, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fcecd4'; ctx.beginPath(); ctx.arc(0, 15, 35, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = d.color; ctx.font = 'bold 24px SimHei'; ctx.textAlign = 'center';
        ctx.fillText(d.name, 0, 180);
        ctx.restore();
        // 吵架气泡逐个冒出
        if (localT > 1.5 + idx * 1.2) {
          drawBubble(cx + d.x, 480, d.text, false, Math.min(1.0, (localT - (1.5 + idx * 1.2))*4));
        }
      });
      ctx.restore();
      if (localT > 7.5) drawBubble(260, 680, '吵出了思想黄金时代！', true, Math.min(1.0, (localT - 7.5)*4));
      break;

    case 6: // 秦 六一统
      ctx.save();
      ctx.translate(cx, cy);
      // 秦始皇呼吸微动
      const qinBreath = Math.sin(localT * 3) * 6;
      ctx.save();
      ctx.translate(0, 50 + qinBreath);
      ctx.fillStyle = '#24211d'; ctx.beginPath(); ctx.ellipse(0, 120, 70, 85, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#a63426'; ctx.beginPath(); ctx.moveTo(-40, 80); ctx.lineTo(0, 140); ctx.lineTo(40, 80); ctx.fill();
      ctx.fillStyle = '#fcecd4'; ctx.beginPath(); ctx.ellipse(0, 30, 52, 48, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#24211d'; ctx.fillRect(-65, -30, 130, 16);
      ctx.strokeStyle = '#24211d'; ctx.lineWidth = 22; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-50, 100); ctx.lineTo(-135, 75); ctx.moveTo(50, 100); ctx.lineTo(135, 75); ctx.stroke();
      ctx.restore();
      // 半两钱弹出
      if (localT > 2.0) {
        ctx.save();
        ctx.translate(-280, 60);
        ctx.fillStyle = '#588b76'; ctx.strokeStyle = '#244b3c'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(0, 0, 65, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#ece4d2'; ctx.fillRect(-22, -22, 44, 44);
        ctx.fillStyle = '#244b3c'; ctx.font = 'bold 22px SimHei'; ctx.textAlign = 'center';

// 自动录制指定时间段 [startT, endT]
window.recordRange = function(startT, endT) {
  return new Promise((resolve) => {
    const stream = cvs.captureStream(60); // 60 FPS 录屏
    const recorder = new MediaRecorder(stream, {
      mimeType: 'video/webm;codecs=vp9',
      videoBitsPerSecond: 10000000 // 10 Mbps 超清码率
    });
    const chunks = [];
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.readAsDataURL(blob);
    };

    recorder.start();
    const startTime = performance.now();
    const duration = endT - startT;

    function loop(now) {
      const elapsed = (now - startTime) / 1000;
      const currentGlobalT = startT + elapsed;
      renderGlobalFrame(currentGlobalT);

      if (elapsed < duration) {
        requestAnimationFrame(loop);
      } else {
        recorder.stop();
      }
    }
    requestAnimationFrame(loop);
  });
};
